version: '3.8'

services:
  # 1. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 2. Valkey Queue System [01:39:35]
  valkey:
    image: valkey/valkey:latest
    container_name: valkey_queue
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

volumes:
  qdrant_data:
  valkey_data: